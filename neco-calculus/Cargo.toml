[package]
name = "neco-calculus"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "public operations for exact polynomial and rational calculus"
documentation = "https://docs.rs/neco-calculus"
readme = "README.md"
keywords = ["calculus", "exact-arithmetic", "algebra"]
categories = ["mathematics", "no-std"]
include = ["Cargo.toml", "src/*.rs", "tests/*.rs", "README.md", "README-ja.md", "LICENSE"]

[features]
default = ["std"]
std = ["neco-polynomial/std", "neco-rational/std", "neco-jet/std", "neco-root/std", "neco-expr/std", "neco-bigint/std", "neco-algnum/std"]

[dependencies]
neco-polynomial = { path = "../neco-polynomial", version = "0.1.1", default-features = false }
neco-rational = { path = "../neco-rational", version = "0.1.1", default-features = false }
neco-jet = { path = "../neco-jet", version = "0.1.1", default-features = false }
neco-root = { path = "../neco-root", version = "0.1.1", default-features = false }
neco-expr = { path = "../../../neco-algebra/neco-algebra-main/neco-expr", version = "=0.2.0", default-features = false }
neco-bigint = { path = "../../../neco-algebra/neco-algebra-main/neco-bigint", version = "=0.1.2", default-features = false }
neco-algnum = { path = "../../../neco-algebra/neco-algebra-main/neco-algnum", version = "=0.1.2", default-features = false }
