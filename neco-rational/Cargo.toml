[package]
name = "neco-rational"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "exact rational functions with checked point and interval domains"
documentation = "https://docs.rs/neco-rational"
readme = "README.md"
keywords = ["calculus", "exact-arithmetic", "algebra"]
categories = ["mathematics", "no-std"]
include = ["Cargo.toml", "src/lib.rs", "tests/*.rs", "README.md", "README-ja.md", "LICENSE"]

[features]
default = ["std"]
std = ["neco-polynomial/std", "neco-algnum/std", "neco-bigint/std"]

[dependencies]
neco-polynomial = { path = "../neco-polynomial", version = "0.1.1", default-features = false }
neco-algnum = { path = "../../../neco-algebra/neco-algebra-main/neco-algnum", version = "=0.1.2", default-features = false }
neco-bigint = { path = "../../../neco-algebra/neco-algebra-main/neco-bigint", version = "=0.1.2", default-features = false }
